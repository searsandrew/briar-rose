name: tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "10.*"
            testbench: "^8.0"
          - php: "8.2"
            laravel: "11.*"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "11.*"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "12.*"
            testbench: "^10.0"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Require compatible Laravel/Testbench
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update -W

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction -W

      - name: Run tests
        run: ./vendor/bin/pest