name: tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10
          - php: "8.2"
            laravel: "10.*"
            testbench: "^8.0"
            pest: "^2.0"

          # Laravel 11
          - php: "8.2"
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^3.0"
          - php: "8.3"
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^3.0"

          # Laravel 12
          - php: "8.3"
            laravel: "12.*"
            testbench: "^10.0"
            pest: "^3.0"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install matrix dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            --no-interaction --no-update -W

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction -W

      - name: Ensure Unit dir exists (Pest 2 expects it sometimes)
        run: |
          mkdir -p tests/Unit
          touch tests/Unit/.gitkeep

      - name: Run tests
        run: ./vendor/bin/pest